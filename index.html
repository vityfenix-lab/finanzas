<style>

:root[data-theme="light"]{--bg:#eef1f8;--card:#fff;--tx:#141a2b;--mu:#5d6785;--bd:#dde2ef;--ac:#0891b2;--ng:#c2410c;--ok:#059669}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:6px 14px 96px}
header{display:flex;align-items:center;gap:8px;padding:10px 0}
header b{flex:1;font-size:19px}header small{color:var(--mu);font-size:12px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 14px;margin-bottom:10px}
.hero{background:linear-gradient(135deg,#0ea5e9,#7c3aed 60%,#db2777);color:#fff;border:0;padding:16px}
.hero small{opacity:.85}.hero .big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}.row>span{color:var(--mu);flex:1}.row b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.neg{color:var(--ng)}.pos{color:var(--ok)}
input{width:110px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;text-align:right}
.add input{flex:1;width:auto;text-align:left}
button{font:inherit;border:0;border-radius:10px;padding:8px 12px;background:var(--ac);color:#04121a;font-weight:600;cursor:pointer}
button.x{background:none;color:var(--mu);padding:6px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.nav b{font-size:20px}.nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);width:42px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;color:var(--mu);border-radius:0;padding:14px 0;font-weight:500}
.tabs button.on{color:var(--ac);font-weight:700}
.g{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.g:last-child{border-bottom:0}.g input{width:100%}.g.h{color:var(--mu);font-size:12px}
.bar{height:12px;border-radius:8px;background:var(--bd);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 6px;font-size:13px;color:var(--mu)}
.pg{padding:10px 0;border-bottom:1px solid var(--bd)}.pg:last-child{border-bottom:0}
.pg div.t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}

 norm();render();
